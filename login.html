<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      linear-gradient(135deg,#064e3b,#14b8a6);
      padding:20px;
    }

    .login-box{
      width:100%;
      max-width:420px;
      background:white;
      padding:35px;
      border-radius:18px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      color:#0f766e;
      margin-bottom:10px;
    }

    p{
      text-align:center;
      margin-bottom:25px;
      color:#666;
    }

    input{
      width:100%;
      padding:15px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      background:#0f766e;
      color:white;
      border-radius:10px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#115e59;
    }

    .error{
      color:red;
      text-align:center;
      margin-bottom:15px;
      display:none;
      font-size:15px;
    }

    .back-link{
      display:block;
      text-align:center;
      margin-top:18px;
      text-decoration:none;
      color:#0f766e;
      font-weight:bold;
    }

  </style>

</head>

<body>

<div class="login-box">

  <h1>Admin Login</h1>

  <p>
    Secure access to donation dashboard
  </p>

  <div class="error" id="errorMessage">
    Invalid username or password
  </div>

  <form onsubmit="loginAdmin(event)">

    <input
      type="text"
      id="username"
      placeholder="Username"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

  <a
    href="index.html"
    class="back-link"
  >
    Back to Website
  </a>

</div>

<script>

  function loginAdmin(event){

    event.preventDefault();

    const username =
      document.getElementById("username").value;

    const password =
      document.getElementById("password").value;

    const errorMessage =
      document.getElementById("errorMessage");

    if(
      username === "admin" &&
      password === "1234"
    ){

      localStorage.setItem(
        "adminLoggedIn",
        "true"
      );

      window.location.href =
        "admin.html";

    }else{

      errorMessage.style.display =
        "block";

    }

  }

</script>

</body>
</html>
