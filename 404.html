<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#064e3b,#14b8a6);
      color:white;
      text-align:center;
      padding:20px;
    }

    .box{
      max-width:500px;
    }

    h1{
      font-size:90px;
      margin-bottom:10px;
    }

    h2{
      font-size:30px;
      margin-bottom:15px;
    }

    p{
      font-size:18px;
      margin-bottom:25px;
    }

    a{
      display:inline-block;
      background:white;
      color:#0f766e;
      padding:14px 22px;
      border-radius:10px;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for does not exist.</p>
    <a href="index.html">Back to Home</a>
  </div>

</body>
</html>
